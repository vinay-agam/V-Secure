<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 840" width="100%" height="100%">
  <defs>
    <linearGradient id="phoneBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="screenBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    <linearGradient id="btnGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="photoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdf4" />
      <stop offset="100%" stop-color="#ecfdf5" />
    </linearGradient>
    <filter id="phoneShadow" x="-10%" y="-8%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#0f172a" flood-opacity="0.12" />
    </filter>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.05" />
    </filter>
  </defs>

  <!-- Phone Exterior Frame (Sleek Platinum / Titanium) -->
  <g filter="url(#phoneShadow)">
    <rect x="20" y="20" width="380" height="800" rx="48" fill="url(#phoneBody)" stroke="#cbd5e1" stroke-width="3"/>
    <rect x="24" y="24" width="372" height="792" rx="44" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  </g>

  <!-- Screen Glass Area (Pure Light Canvas) -->
  <rect x="32" y="32" width="356" height="776" rx="40" fill="url(#screenBg)"/>

  <!-- Dynamic Island Notch -->
  <rect x="150" y="44" width="120" height="26" rx="13" fill="#0f172a"/>
  <circle cx="250" cy="57" r="4.5" fill="#1e293b"/>

  <!-- Status Bar (9:41 AM, 5G, Battery) -->
  <text x="60" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#0f172a">09:41</text>
  <g transform="translate(325, 52)" fill="#0f172a">
    <rect x="0" y="2" width="22" height="11" rx="3" fill="none" stroke="#0f172a" stroke-width="1.2"/>
    <rect x="2" y="4" width="15" height="7" rx="1.5" fill="#059669"/>
    <rect x="23" y="5" width="2" height="5" rx="1" fill="#0f172a"/>
  </g>

  <!-- App Header -->
  <g transform="translate(52, 95)">
    <!-- VS Logo (Forest Emerald) -->
    <rect width="36" height="36" rx="10" fill="url(#btnGrad)"/>
    <text x="8" y="24" font-family="'Outfit', sans-serif" font-weight="900" font-size="15" fill="#ffffff">VS</text>
    <text x="46" y="20" font-family="'Outfit', sans-serif" font-size="15" font-weight="800" fill="#0f172a">V SECURE</text>
    <text x="46" y="33" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#d97706">MONITORING APP</text>
    <!-- Notification Bell -->
    <circle cx="280" cy="18" r="16" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
    <path d="M 280,10 C 276,10 274,13 274,18 L 272,21 L 288,21 L 286,18 C 286,13 284,10 280,10 Z" fill="#475569"/>
    <circle cx="288" cy="11" r="4" fill="#ef4444" stroke="#ffffff" stroke-width="1"/>
  </g>

  <!-- Property Selector Pill Card -->
  <g transform="translate(52, 145)" filter="url(#cardShadow)">
    <rect width="316" height="44" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <circle cx="22" cy="22" r="5" fill="#059669"/>
    <text x="36" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#0f172a">Plot #42 — Green Meadows (OMR)</text>
    <text x="286" y="26" font-family="sans-serif" font-size="11" fill="#64748b">▼</text>
  </g>

  <!-- Latest Inspection Card -->
  <g transform="translate(52, 204)" filter="url(#cardShadow)">
    <rect width="316" height="212" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    
    <!-- Photo Thumbnail Placeholder (Sunny Landscape Plot) -->
    <rect x="12" y="12" width="292" height="122" rx="10" fill="url(#photoGrad)" stroke="#a7f3d0" stroke-width="1"/>
    <!-- Simulated Plot Inspection Canvas -->
    <path d="M 12,95 L 110,65 L 210,85 L 304,50 L 304,134 L 12,134 Z" fill="#dcfce7" opacity="0.8"/>
    <circle cx="240" cy="45" r="14" fill="#fef08a" opacity="0.6"/>
    <line x1="50" y1="125" x2="265" y2="80" stroke="#059669" stroke-width="2" stroke-dasharray="6,3"/>
    
    <!-- Geo Stamp Pill on Photo -->
    <rect x="20" y="20" width="224" height="24" rx="6" fill="rgba(255,255,255,0.95)" stroke="#cbd5e1" stroke-width="0.8"/>
    <text x="28" y="36" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#047857">📍 12.9716° N, 80.2437° E • VERIFIED</text>
    
    <!-- Date & Inspector Status -->
    <text x="20" y="158" font-family="'Outfit', sans-serif" font-size="13" font-weight="700" fill="#0f172a">Field Audit Verified</text>
    <text x="20" y="174" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#64748b">Visit Date: 18 Oct 2026 • Premium Plan</text>
    
    <rect x="205" y="150" width="98" height="24" rx="12" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1"/>
    <text x="216" y="166" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#059669">✓ 100% HEALTHY</text>
  </g>

  <!-- Quick Health Metrics (2 Light Columns) -->
  <g transform="translate(52, 432)">
    <!-- Boundary Metric -->
    <rect x="0" y="0" width="152" height="74" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#cardShadow)"/>
    <text x="16" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#64748b">Boundary Status</text>
    <text x="16" y="44" font-family="'Outfit', sans-serif" font-size="13" font-weight="800" fill="#059669">✓ Intact / Clear</text>
    <text x="16" y="60" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#94a3b8">Survey pegs intact</text>

    <!-- Fencing / Cleaning Metric -->
    <rect x="164" y="0" width="152" height="74" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#cardShadow)"/>
    <text x="180" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#64748b">Plot Maintenance</text>
    <text x="180" y="44" font-family="'Outfit', sans-serif" font-size="13" font-weight="800" fill="#d97706">Cleared (Q3)</text>
    <text x="180" y="60" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#94a3b8">Next clearing: Dec</text>
  </g>

  <!-- Recent Inspection History Section -->
  <g transform="translate(52, 522)">
    <text x="4" y="14" font-family="'Outfit', sans-serif" font-size="13" font-weight="700" fill="#0f172a">Inspection Timeline</text>
    
    <!-- Item 1 -->
    <g transform="translate(0, 24)" filter="url(#cardShadow)">
      <rect width="316" height="52" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
      <circle cx="26" cy="26" r="14" fill="#ecfdf5"/>
      <text x="20" y="30" font-family="sans-serif" font-size="12" fill="#059669">📋</text>
      <text x="50" y="22" font-family="'Outfit', sans-serif" font-size="12" font-weight="700" fill="#0f172a">October 2026 Inspection</text>
      <text x="50" y="38" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#64748b">18 high-res photos • 1 video walk</text>
      <text x="256" y="30" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#047857">VIEW →</text>
    </g>
    
    <!-- Item 2 -->
    <g transform="translate(0, 84)" filter="url(#cardShadow)">
      <rect width="316" height="52" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
      <circle cx="26" cy="26" r="14" fill="#ecfdf5"/>
      <text x="20" y="30" font-family="sans-serif" font-size="12" fill="#059669">📋</text>
      <text x="50" y="22" font-family="'Outfit', sans-serif" font-size="12" font-weight="700" fill="#0f172a">September 2026 Inspection</text>
      <text x="50" y="38" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#64748b">14 high-res photos • Boundary OK</text>
      <text x="256" y="30" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#047857">VIEW →</text>
    </g>
  </g>

  <!-- Primary Action Button (Forest Emerald) -->
  <g transform="translate(52, 680)">
    <rect width="316" height="46" rx="23" fill="url(#btnGrad)" filter="url(#cardShadow)"/>
    <text x="65" y="28" font-family="'Outfit', sans-serif" font-size="12" font-weight="800" fill="#ffffff" letter-spacing="0.5">DOWNLOAD FULL REPORT (PDF)</text>
  </g>

  <!-- Bottom Navigation Bar (Clean White) -->
  <g transform="translate(32, 738)">
    <rect width="356" height="70" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    
    <g transform="translate(50, 18)">
      <circle cx="10" cy="10" r="14" fill="#ecfdf5"/>
      <text x="3" y="15" font-family="sans-serif" font-size="14" fill="#047857">🏠</text>
      <text x="0" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#047857">Home</text>
    </g>
    <g transform="translate(130, 18)">
      <text x="3" y="15" font-family="sans-serif" font-size="14" fill="#64748b">📍</text>
      <text x="-8" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="600" fill="#64748b">Audits</text>
    </g>
    <g transform="translate(210, 18)">
      <text x="3" y="15" font-family="sans-serif" font-size="14" fill="#64748b">🛠️</text>
      <text x="-6" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="600" fill="#64748b">Services</text>
    </g>
    <g transform="translate(290, 18)">
      <text x="3" y="15" font-family="sans-serif" font-size="14" fill="#64748b">👤</text>
      <text x="-6" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="600" fill="#64748b">Profile</text>
    </g>
  </g>

  <!-- Home Indicator Bar -->
  <rect x="145" y="796" width="130" height="4" rx="2" fill="#94a3b8"/>
</svg>
